<!DOCTYPE html>
<html lang="en">
<head>
  <title>three.js webgl - materials - car</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <link type="text/css" rel="stylesheet" href="main.css">
  <style>
    body {
      margin: 0;
      color: #bbbbbb;
      background: #333333;
      overflow: hidden;
    }
    a {
      color: #08f;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
    }
    .colorPicker {
      display: inline-block;
      margin: 0 10px;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> car materials<br />
    Ferrari 458 Italia model by <a href="https://sketchfab.com/models/57bf6cc56931426e87494f554df1dab6" target="_blank" rel="noopener">vicent091036</a>
    <br><br>
    <span class="colorPicker"><input id="body-color" type="color" value="#ff0000"><br />Body</span>
    <span class="colorPicker"><input id="details-color" type="color" value="#ffffff"><br />Details</span>
    <span class="colorPicker"><input id="glass-color" type="color" value="#ffffff"><br />Glass</span>
  </div>

  <div id="container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "../build/three.module.js",
        "three/addons/": "./jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/addons/libs/stats.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    let camera, scene, renderer, stats, grid, controls;
    const wheels = [];
    let wheelCamera;
    let wheel_fl;

    function init() {
      const container = document.getElementById('container');

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setAnimationLoop(animate);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.85;
      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);

      stats = new Stats();
      container.appendChild(stats.dom);

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(4.25, 1.4, -4.5);

      controls = new OrbitControls(camera, container);
      controls.maxDistance = 9;
      controls.maxPolarAngle = THREE.MathUtils.degToRad(90);
      controls.target.set(0, 0.5, 0);
      controls.update();

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x333333);
      scene.environment = new RGBELoader().load('textures/equirectangular/venice_sunset_1k.hdr');
      scene.environment.mapping = THREE.EquirectangularReflectionMapping;
      scene.fog = new THREE.Fog(0x333333, 10, 15);

      grid = new THREE.GridHelper(20, 40, 0xffffff, 0xffffff);
      grid.material.opacity = 0.2;
      grid.material.depthWrite = false;
      grid.material.transparent = true;
      scene.add(grid);

      const bodyMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xff0000, metalness: 1.0, roughness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.03
      });

      const detailsMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff, metalness: 1.0, roughness: 0.5
      });

      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, metalness: 0.25, roughness: 0, transmission: 1.0
      });

      document.getElementById('body-color').addEventListener('input', function () {
        bodyMaterial.color.set(this.value);
      });

      document.getElementById('details-color').addEventListener('input', function () {
        detailsMaterial.color.set(this.value);
      });

      document.getElementById('glass-color').addEventListener('input', function () {
        glassMaterial.color.set(this.value);
      });

      const shadow = new THREE.TextureLoader().load('models/gltf/ferrari_ao.png');

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('jsm/libs/draco/gltf/');

      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);

      loader.load('models/gltf/ferrari.glb', function (gltf) {
        const carModel = gltf.scene.children[0];

        carModel.getObjectByName('body').material = bodyMaterial;

        carModel.getObjectByName('rim_fl').material = detailsMaterial;
        carModel.getObjectByName('rim_fr').material = detailsMaterial;
        carModel.getObjectByName('rim_rr').material = detailsMaterial;
        carModel.getObjectByName('rim_rl').material = detailsMaterial;
        carModel.getObjectByName('trim').material = detailsMaterial;

        carModel.getObjectByName('glass').material = glassMaterial;

        wheel_fl = carModel.getObjectByName('wheel_fl');
        wheels.push(
          wheel_fl,
          carModel.getObjectByName('wheel_fr'),
          carModel.getObjectByName('wheel_rl'),
          carModel.getObjectByName('wheel_rr')
        );

        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(0.655 * 4, 1.3 * 4),
          new THREE.MeshBasicMaterial({
            map: shadow,
            blending: THREE.MultiplyBlending,
            toneMapped: false,
            transparent: true
          })
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.renderOrder = 2;
        carModel.add(mesh);

        scene.add(carModel);

        // Add secondary camera for wheel close-up
        wheelCamera = new THREE.PerspectiveCamera(25, 1, 0.1, 10);
        scene.add(wheelCamera);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      controls.update();

      const time = -performance.now() / 1000;

      for (let i = 0; i < wheels.length; i++) {
        wheels[i].rotation.x = time * Math.PI * 2;
      }

      grid.position.z = -(time) % 1;

      // Main render
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.setScissorTest(false);
      renderer.render(scene, camera);

      // Wheel camera render (top-right corner)
      if (wheel_fl && wheelCamera) {
        const wheelPosition = new THREE.Vector3();
        wheel_fl.getWorldPosition(wheelPosition);

        wheelCamera.position.copy(wheelPosition).add(new THREE.Vector3(0.5, 0.5, 0.5));
        wheelCamera.lookAt(wheelPosition);

        const size = Math.min(window.innerWidth, window.innerHeight) / 4;

        renderer.setViewport(window.innerWidth - size - 10, window.innerHeight - size - 10, size, size);
        renderer.setScissor(window.innerWidth - size - 10, window.innerHeight - size - 10, size, size);
        renderer.setScissorTest(true);
        renderer.render(scene, wheelCamera);
      }

      stats.update();
    }

    init();
  </script>
</body>
</html>
